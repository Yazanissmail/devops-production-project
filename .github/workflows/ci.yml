name: CI Pipeline

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python Syntax
        run: python -m py_compile app.py

      - name: Build Docker Image
        run: docker build -t devops-flask-app:ci .

      - name: Run Docker Container
        run: docker run -d --name ci-test-container -p 5000:5000 devops-flask-app:ci

      - name: Wait for Application
        run: sleep 5

      - name: Test Health Endpoint
        run: curl --fail http://127.0.0.1:5000/health

      - name: Show Logs on Failure
        if: failure()
        run: docker logs ci-test-container || true

      - name: Clean Up Container
        if: always()
        run: docker rm -f ci-test-container || true
